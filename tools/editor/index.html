<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Level / prefab editor</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #0b1020;
        color: #e2e8f0;
        font-family: system-ui, sans-serif;
      }
      #view {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }
      .overlay {
        position: fixed;
        pointer-events: none;
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.7);
      }
      #title {
        top: 12px;
        left: 14px;
        font-size: 13px;
        font-weight: 600;
        opacity: 0.9;
      }
      #hint {
        left: 14px;
        bottom: 12px;
        font-size: 12px;
        opacity: 0.65;
      }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <div id="title" class="overlay">level editor</div>
    <div id="hint" class="overlay">Orbit: drag · Select: click (Esc) · T/R/S transform · Place: panel then click · Ctrl+D dup · Del delete · Play: panel (WASD/Space, mouse-look, Esc)</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
