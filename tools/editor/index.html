<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Level / prefab editor</title>
    <style>
      /*
        Fixed-panel editor shell: toolbar / hierarchy | viewport | inspector / palette / status.
        One CSS grid; the three panel sizes are custom properties that the splitters write to, so
        dragging a divider is a single style write and never a re-layout in JS.
      */
      :root {
        --left: 240px;
        --right: 300px;
        --bottom: 190px;
        --bg: #14161a;
        --panel: #1c1f24;
        --panel-head: #23272e;
        --line: #34383f;
        --text: #d5d9e0;
        --dim: #8b929d;
        --accent: #4a8cf7;
        --accent-dim: #2f5fa8;
        --hover: #2a2f37;
        --sel: #3a4a63;
        /* Every other Hierarchy row, so a long list reads as rows and not as one block. Well below --hover,
           so hovering still says which row the pointer is on. */
        --row-alt: #21252c;
        --link: #6ab0ff;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: var(--bg);
        color: var(--text);
        font: 12px/1.45 system-ui, sans-serif;
      }
      #app {
        display: grid;
        height: 100%;
        grid-template-columns: var(--left) 5px 1fr 5px var(--right);
        grid-template-rows: 34px 1fr 5px var(--bottom) 22px;
        grid-template-areas:
          'tool tool tool tool tool'
          'left sl   view sr   right'
          'sb   sb   sb   sb   sb'
          'bot  bot  bot  bot  bot'
          'stat stat stat stat stat';
      }

      /* ---- panels ---- */
      .panel {
        background: var(--panel);
        border: 1px solid var(--line);
        display: flex;
        flex-direction: column;
        min-width: 0;
        min-height: 0;
        overflow: hidden;
      }
      .panel > h2 {
        margin: 0;
        padding: 5px 8px;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: var(--dim);
        background: var(--panel-head);
        border-bottom: 1px solid var(--line);
        flex: 0 0 auto;
        user-select: none;
      }
      .panel-body {
        flex: 1 1 auto;
        overflow: auto;
        min-height: 0;
      }

      /* ---- bottom panel tabs: Project and Animation share the one wide row ---- */
      .tabs {
        display: flex;
        align-items: stretch;
        gap: 1px;
        background: var(--panel-head);
        border-bottom: 1px solid var(--line);
        flex: 0 0 auto;
        user-select: none;
      }
      .tab {
        appearance: none;
        border: 0;
        border-bottom: 2px solid transparent;
        background: transparent;
        color: var(--dim);
        font: inherit;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        padding: 5px 12px;
        cursor: pointer;
      }
      .tab:hover {
        background: var(--hover);
        color: var(--text);
      }
      .tab.on {
        color: var(--text);
        border-bottom-color: var(--accent);
      }
      .tab-note {
        margin-left: auto;
        align-self: center;
        padding: 0 8px;
        font-size: 11px;
        color: var(--dim);
      }

      /* ---- the editor's one context menu (menu.ts) ---- */
      .menu {
        position: fixed;
        z-index: 50;
        min-width: 190px;
        max-width: 320px;
        padding: 3px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 4px;
        box-shadow: 0 6px 18px #0009;
        display: flex;
        flex-direction: column;
      }
      .menu:focus {
        outline: none;
      }
      .menu-head {
        padding: 4px 8px 5px;
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: var(--dim);
        border-bottom: 1px solid var(--line);
        margin-bottom: 2px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .menu-div {
        height: 1px;
        margin: 3px 4px;
        background: var(--line);
      }
      .menu button {
        appearance: none;
        display: flex;
        align-items: center;
        gap: 12px;
        border: 0;
        background: transparent;
        color: var(--text);
        font: inherit;
        font-size: 12px;
        text-align: left;
        padding: 4px 8px;
        border-radius: 3px;
        cursor: pointer;
      }
      .menu button:hover:not(:disabled),
      .menu button:focus-visible {
        background: var(--sel);
        outline: none;
      }
      /*
        A disabled item stays, greyed. An operation refused on an inherited node currently does nothing with no
        explanation, and a menu that omits it teaches nothing either — the `title` says why.
      */
      .menu button:disabled {
        color: var(--dim);
        cursor: default;
      }
      .menu-label {
        flex: 1 1 auto;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      /* The shortcut, so the menu teaches the keyboard rather than replacing it. */
      .menu-hint {
        flex: 0 0 auto;
        font-size: 11px;
        color: var(--dim);
      }
      /* Submenu arrow. Takes the hint's slot, because an item cannot have both. */
      .menu-more {
        flex: 0 0 auto;
        font-size: 13px;
        line-height: 1;
        color: var(--dim);
      }
      .menu button:hover:not(:disabled) .menu-more,
      .menu button:focus-visible .menu-more {
        color: var(--text);
      }

      #left {
        grid-area: left;
      }
      #right {
        grid-area: right;
      }
      #bottom {
        grid-area: bot;
      }
      #centre {
        grid-area: view;
        position: relative;
        overflow: hidden;
        min-width: 0;
        min-height: 0;
      }
      #view {
        display: block;
        width: 100%;
        height: 100%;
      }
      /* ---- curve editor (ADR 0088) ---- */
      .curve-ed {
        display: flex;
        flex-direction: column;
        gap: 4px;
        width: 100%;
      }
      .curve-ed-canvas {
        display: block;
        background: rgba(0, 0, 0, 0.25);
        border: 1px solid var(--line);
        border-radius: 3px;
        cursor: crosshair;
        outline: none;
        max-width: 100%;
      }
      .curve-ed-canvas:focus {
        border-color: var(--accent);
      }
      .curve-ed-read {
        font-size: 10px;
        color: var(--dim);
        min-height: 12px;
      }
      .curve-ed-fields {
        display: flex;
        gap: 4px;
        align-items: center;
        font-size: 10px;
        color: var(--dim);
      }
      .curve-ed-num {
        width: 72px;
      }
      /* The enlarged graph, over everything (ADR 0088). */
      .curve-ed-big {
        position: fixed;
        inset: 0;
        z-index: 50;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 8px;
        background: rgba(0, 0, 0, 0.6);
      }
      .curve-ed-big-h {
        display: flex;
        gap: 12px;
        align-items: center;
        color: var(--text);
        font-size: 12px;
      }
      .curve-ed-big .curve-ed {
        width: auto;
        padding: 10px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 6px;
      }

      /* The real game, framed over the viewport while a level plays (ADR 0086). */
      #game-frame {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        border: 0;
        background: #000;
      }

      /* ---- splitters ---- */
      .splitter {
        background: var(--bg);
      }
      .splitter:hover,
      .splitter.dragging {
        background: var(--accent-dim);
      }
      #split-left {
        grid-area: sl;
        cursor: col-resize;
      }
      #split-right {
        grid-area: sr;
        cursor: col-resize;
      }
      #split-bottom {
        grid-area: sb;
        cursor: row-resize;
      }

      /* ---- toolbar ---- */
      #toolbar {
        grid-area: tool;
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 0 8px;
        background: var(--panel-head);
        border-bottom: 1px solid var(--line);
        user-select: none;
      }
      .tb-group {
        display: flex;
        align-items: center;
        gap: 4px;
      }
      .tb-sep {
        width: 1px;
        height: 18px;
        background: var(--line);
        margin: 0 4px;
      }
      .tb-label {
        color: var(--dim);
        font-size: 11px;
      }
      /*
        Our own controls carry `.ctl`. Styling bare `button`/`select`/`input` instead reached inside
        Tweakpane, which renders numeric fields as `type="text"` — so `input[type='text'] {width:120px}`
        out-specificity'd its `.tp-pndtxtv_a {width:100%}` and forced every axis field to 120px, three of
        them to a row, in a 300px panel. A class keeps the boundary explicit: these are ours, Tweakpane
        styles its own.
      */
      .ctl {
        font: inherit;
        color: var(--text);
        background: #2b3038;
        border: 1px solid var(--line);
        border-radius: 3px;
        padding: 3px 8px;
      }
      button.ctl {
        cursor: pointer;
      }
      .ctl:hover {
        background: var(--hover);
        border-color: #454b55;
      }
      .ctl.on {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }
      .ctl.on:hover {
        background: #5b98f8;
      }
      .ctl[hidden] {
        display: none;
      }
      input.ctl[type='number'] {
        width: 56px;
      }
      input.ctl[type='text'] {
        width: 120px;
      }
      input.ctl[type='checkbox'] {
        padding: 0;
        accent-color: var(--accent);
      }
      .ctl:disabled {
        opacity: 0.45;
        cursor: default;
      }
      .seg {
        display: flex;
      }
      .seg .ctl {
        border-radius: 0;
        border-right-width: 0;
      }
      .seg .ctl:first-child {
        border-radius: 3px 0 0 3px;
      }
      .seg .ctl:last-child {
        border-radius: 0 3px 3px 0;
        border-right-width: 1px;
      }

      /* ---- hierarchy ---- */
      .row {
        display: flex;
        align-items: center;
        gap: 4px;
        padding: 2px 6px;
        cursor: default;
        white-space: nowrap;
        user-select: none;
      }
      /* Zebra striping, by **rendered** position rather than by depth or document index: what the eye counts
         is the rows it can see, and a collapsed subtree removes them. Before `:hover` and `.sel` on purpose —
         same specificity, so source order lets both of those win over the stripe.

         The Environment and Game rows are skipped: they are level settings above the tree, already set apart
         by their own rule, and striping them would make the first object's shade depend on whether they are
         there. They still count for `nth-child`, so the tree's alternation is stable. */
      .row:not(.env):nth-child(even) {
        background: var(--row-alt);
      }
      .row:hover {
        background: var(--hover);
      }
      .row.sel {
        background: var(--sel);
      }
      /* The Environment row is a level setting, not an object, so it sits above the tree with a rule under it
         rather than being indented into it (ADR 0048). */
      .row.env {
        border-bottom: 1px solid var(--line, #2a3344);
        opacity: 0.9;
      }
      /* One of a multi-selection is the primary: the one the Inspector shows and the one a Shift-range anchors
         on. Marked with an edge rather than a different fill, so the row still reads as selected. */
      .row.primary {
        box-shadow: inset 2px 0 0 var(--accent);
      }
      /* Switched off, or off because a parent is: it is not in the level, so it reads like the Environment
         row's dimming rather than like a selection. The checkbox that changes it is in the Inspector's
         header, where Unity puts it (ADR 0102). */
      .row.off .name {
        color: var(--dim);
        font-style: italic;
      }
      .row .twist {
        width: 12px;
        color: var(--dim);
        cursor: pointer;
        text-align: center;
        flex: 0 0 auto;
      }
      .row .name {
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .row.linked .name {
        color: var(--link);
      }
      /* Indentation comes from the row's depth, set inline — a fixed inset here would fight it. */
      .row.piece {
        color: var(--dim);
      }
      .row.dragging {
        opacity: 0.4;
      }
      /* Insertion line, drawn inside the row so no layout shifts while dragging. */
      .row.drop-above {
        box-shadow: inset 0 2px 0 0 var(--accent);
      }
      .row.drop-below {
        box-shadow: inset 0 -2px 0 0 var(--accent);
      }
      /* Dropped *onto* — this row becomes the parent, so the whole row is the target, not an edge. */
      .row.drop-onto,
      .tile.drop-onto,
      .tiles.drop-onto {
        box-shadow: inset 0 0 0 2px var(--accent);
      }
      .row input.rename {
        flex: 1 1 auto;
        min-width: 0;
        padding: 0 4px;
      }
      .row .badge {
        margin-left: auto;
        font-size: 10px;
        color: var(--dim);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 0 5px;
        flex: 0 0 auto;
      }
      .row .badge.trig {
        color: #7ddc9a;
        border-color: #2f5c40;
      }
      /* Held by someone else (ADR 0089): dimmed, their name where the count would be. */
      .row.held {
        opacity: 0.6;
      }
      .row .badge.held {
        color: #f0b860;
        border-color: #6b5324;
      }
      .empty {
        padding: 8px;
        color: var(--dim);
      }

      /* ---- project explorer: header, folder tree, tiles ---- */
      #palette {
        display: flex;
        flex-direction: column;
        min-height: 0;
        overflow: hidden;
      }
      .ex-head {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 4px 6px;
        border-bottom: 1px solid var(--line);
        flex: 0 0 auto;
        overflow-x: auto;
      }
      .ex-crumbs {
        display: flex;
        align-items: center;
        gap: 2px;
        flex: 0 0 auto;
      }
      .crumb {
        padding: 1px 6px;
        font-size: 11px;
      }
      .ex-crumbs .crumb + .crumb::before {
        content: '/';
        color: var(--dim);
        margin-right: 4px;
      }
      .ex-body {
        display: flex;
        flex: 1 1 auto;
        min-height: 0;
      }
      .ex-tree {
        flex: 0 0 168px;
        overflow: auto;
        border-right: 1px solid var(--line);
        min-height: 0;
        padding: 2px 0;
      }
      .ex-right {
        display: flex;
        flex-direction: column;
        flex: 1 1 auto;
        min-width: 0;
        min-height: 0;
      }
      .tile.folder {
        font-weight: 600;
      }
      .tiles {
        display: flex;
        flex-wrap: wrap;
        align-content: flex-start;
        gap: 4px;
        overflow: auto;
        min-height: 0;
        flex: 1 1 auto;
        padding: 6px;
      }
      .tile {
        padding: 4px 9px;
      }
      .tile.foreign {
        opacity: 0.4;
        cursor: not-allowed;
      }
      .tile.armed {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }
      .tile.new {
        border-style: dashed;
      }
      /* A tile with a preview: picture over name. Prefabs, models and materials are rendered once
         offscreen and cached; a texture is its own file; sounds and fonts stay text. */
      .tile.has-thumb {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 3px;
        padding: 4px;
        width: 92px;
        font-size: 11px;
        overflow: hidden;
      }
      .tile .thumb {
        width: 64px;
        height: 64px;
        /* Empty until the observer fills it in, so an unfilled tile must not look broken. */
        color: transparent;
        font-size: 0;
        object-fit: contain;
        background: #0e1013 repeating-conic-gradient(#1b1e23 0% 25%, transparent 0% 50%) 50% / 12px 12px;
        border-radius: 2px;
        flex: 0 0 auto;
      }
      .tile .tile-name {
        max-width: 100%;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .asset-preview {
        display: flex;
        align-items: center;
        gap: 8px;
        flex: 0 0 auto;
        min-height: 0;
        padding: 0 6px 6px;
      }
      .asset-preview img {
        max-height: 96px;
        max-width: 40%;
        object-fit: contain;
        border: 1px solid var(--line);
      }
      .asset-preview .caption {
        color: var(--dim);
        font-size: 11px;
      }
      .font-sample {
        font-size: 20px;
      }

      /* ---- asset inspector (materials) ---- */
      #asset-inspector {
        padding: 6px;
      }
      .a-head {
        margin-bottom: 6px;
        padding-bottom: 6px;
        border-bottom: 1px solid var(--line);
      }
      .a-name {
        font-weight: 600;
      }
      .a-meta {
        color: var(--dim);
        font-size: 10px;
        word-break: break-all;
      }
      .a-row {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-bottom: 4px;
      }
      .a-label {
        flex: 0 0 92px;
        color: var(--dim);
      }
      .a-row > :not(.a-label) {
        flex: 1 1 auto;
        min-width: 0;
      }
      .a-vec,
      .a-texture {
        display: flex;
        gap: 4px;
        align-items: center;
        min-width: 0;
      }
      .a-vec input {
        flex: 1 1 0;
        min-width: 0;
      }
      .a-texture select {
        flex: 1 1 auto;
        min-width: 0;
      }
      .a-texture .thumb {
        width: 24px;
        height: 24px;
        object-fit: cover;
        border: 1px solid var(--line);
        border-radius: 2px;
        flex: 0 0 auto;
      }
      .a-warn {
        color: #f0b849;
        font-size: 11px;
        margin: 4px 0;
      }

      /* ---- inspector header: name + prefab link (ours, above the tweakpane grid) ---- */
      #insp-head {
        padding: 6px;
        border-bottom: 1px solid var(--line);
      }
      /* Tick then name, which is a component section's header one level up (ADR 0102). */
      #insp-head .namerow {
        display: flex;
        align-items: center;
        gap: 6px;
        min-width: 0;
      }
      #insp-head input.name {
        flex: 1 1 auto;
        min-width: 0;
        font-weight: 600;
      }
      #insp-head .link {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-top: 6px;
        font-size: 11px;
        color: var(--dim);
        min-width: 0;
      }
      #insp-head .link .who {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      /* Unity tints a prefab instance; the link line borrows the same cue as the hierarchy row. */
      #insp-head .link.linked .who {
        color: var(--link);
      }
      #insp-head .link .ctl {
        margin-left: auto;
        flex: 0 0 auto;
        padding: 2px 6px;
      }

      #insp-head .multi {
        margin-top: 5px;
        padding: 2px 5px;
        font-size: 11px;
        border-radius: 3px;
        background: #2b3038;
        color: var(--dim);
      }

      /*
        ---- inspector: our chrome around tweakpane's widgets (ADR 0038) ----

        A section is a header row we draw plus a body that holds one small tweakpane. The header carries what
        tweakpane's folder title could only spell into a string: the enable checkbox, a badge, and a menu.
      */
      .isec {
        border: 1px solid var(--line);
        border-radius: 3px;
        margin-bottom: 5px;
        background: #1f2329;
      }
      .isec-h {
        display: flex;
        align-items: center;
        gap: 5px;
        padding: 3px 4px;
        background: var(--panel-head);
        border-radius: 2px 2px 0 0;
        min-width: 0;
      }
      /* An off component is still readable — it is a state, not an error. */
      .isec.off .isec-h,
      .isec.off .isec-body {
        opacity: 0.5;
      }
      .isec-tw,
      .isec-m {
        flex: 0 0 auto;
        width: 16px;
        height: 16px;
        padding: 0;
        line-height: 14px;
        text-align: center;
        font-size: 10px;
        color: var(--dim);
        background: none;
        border: 0;
        border-radius: 2px;
        cursor: pointer;
      }
      .isec-m {
        margin-left: auto;
        font-size: 13px;
      }
      .isec-tw:hover,
      .isec-m:hover {
        color: var(--text);
        background: #3a414c;
      }
      .isec-en {
        flex: 0 0 auto;
        margin: 0;
        accent-color: var(--accent);
      }
      .isec-t {
        flex: 0 1 auto;
        font-weight: 600;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .isec-badge {
        flex: 0 0 auto;
        padding: 0 4px;
        font-size: 10px;
        line-height: 15px;
        border-radius: 7px;
        color: #0d1014;
        background: var(--link);
      }
      .isec-body {
        padding: 3px 5px 5px;
      }
      /* A section with overrides gets the same left bar its rows do, so it reads at a glance while scrolling. */
      .isec.over-sec {
        border-left: 2px solid var(--link);
      }

      /* A read-only line: a label and a value, and never a bordered box pretending to be a field. */
      .irow {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 2px 0;
        min-width: 0;
      }
      .irow-l {
        flex: 0 0 92px;
        color: var(--dim);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .irow-v {
        flex: 1 1 auto;
        color: var(--text);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      /*
        A multi-selection's own number boxes (ADR 0112). Tweakpane binds a vec3 as one object and its number
        input cannot be empty, so an axis whose value differs across the selection is drawn here instead —
        blank, with a placeholder dash. Sized to sit in the same row as a Tweakpane point input's three boxes.
      */
      /*
        The slot is an `.irow-v`, which is `flex: 1 1 auto` — so it sizes to its content unless told not to.
        Three `<input>`s have a large intrinsic width (a text input is ~20 characters by default), which pushed
        the row past the panel and gave the whole Inspector a horizontal scrollbar. `min-width: 0` lets the
        slot shrink below its content, and `width: 0` on each input defeats the intrinsic size so `flex-grow`
        is what decides how wide they are.
      */
      .imulti {
        display: flex;
        gap: 4px;
        min-width: 0;
        overflow: hidden;
      }
      .imulti-n {
        flex: 1 1 0;
        width: 0;
        min-width: 0;
        padding: 3px 5px;
        border: 1px solid var(--line);
        border-radius: 3px;
        background: var(--bg);
        color: var(--text);
        font: inherit;
      }
      .imulti-c {
        margin: 0;
        accent-color: var(--accent);
      }
      /* A row the selection disagrees about, so the blank reads as "differs" rather than as empty. */
      .isec-body .irow.mixed .irow-l {
        font-style: italic;
      }
      .imulti-n::placeholder {
        color: var(--dim);
      }
      /* The spinner arrows cost width the three boxes cannot spare, and the gizmo is how you nudge a value. */
      .imulti-n[type='number'] {
        appearance: textfield;
        -moz-appearance: textfield;
      }
      .imulti-n[type='number']::-webkit-inner-spin-button,
      .imulti-n[type='number']::-webkit-outer-spin-button {
        appearance: none;
        margin: 0;
      }
      .imulti-n:focus {
        outline: 1px solid var(--accent);
      }

      /* Unity's cue for an overridden value: a bar down the left edge of the row. */
      #inspector .over,
      .isec-body .irow.over {
        position: relative;
      }
      #inspector .over::before,
      .isec-body .irow.over::before {
        content: '';
        position: absolute;
        left: -5px;
        top: 1px;
        bottom: 1px;
        width: 2px;
        background: var(--link);
      }

      .iover {
        display: flex;
        align-items: center;
        gap: 5px;
        margin-bottom: 5px;
        padding: 3px 5px;
        font-size: 11px;
        border-radius: 3px;
        color: var(--dim);
        background: #23272e;
      }
      .iover.on {
        color: var(--link);
        background: #1e2937;
      }
      .iover-t {
        flex: 1 1 auto;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .ctl.tiny {
        flex: 0 0 auto;
        padding: 1px 5px;
        font-size: 11px;
      }
      .ctl.wide {
        width: 100%;
        padding: 4px;
      }
      .ctl.danger:hover:not(:disabled) {
        border-color: #a2413a;
        background: #3a2523;
      }
      .iadd {
        margin: 6px 0 5px;
      }
      .ifoot {
        display: flex;
        gap: 5px;
      }
      .ifoot .ctl {
        flex: 1 1 0;
        padding: 3px;
      }

      /* ---- inspector (tweakpane mounts here) ---- */
      /*
        Tweakpane lays a row out as a *growing label* beside a *fixed* value column
        (`.tp-lblv_l {flex:1}`, `.tp-lblv_v {width: var(--bld-vw, 160px); flex-shrink:0}`), sized for the
        256px pane it normally creates for itself. Mounted in a 300px panel that reads as a wide empty gap
        before the values, and the fixed column cannot shrink, so anything inside it overflows sideways.
        Inverted here to the Unity arrangement: fixed label column, values take the rest — and `min-width:0`
        at every level, because an <input>'s min-content width is ~20 characters and a flex item will not
        go below that on its own.
      */
      #inspector .tp-lblv_l {
        flex: 0 0 92px;
        padding-left: 0;
        padding-right: 6px;
      }
      #inspector .tp-lblv_v {
        flex: 1 1 auto;
        width: auto;
        min-width: 0;
      }
      #inspector .tp-pndtxtv_a,
      #inspector .tp-txtv,
      #inspector input {
        min-width: 0;
      }
      #inspector {
        padding: 6px;
        --tp-base-border-radius: 0;
        --tp-container-horizontal-padding: 0;
        --tp-base-background-color: transparent;
        --tp-base-shadow-color: transparent;
        --tp-container-background-color: #2b3038;
        --tp-container-background-color-active: #3a414c;
        --tp-container-background-color-focus: #343b45;
        --tp-container-background-color-hover: #333a44;
        --tp-container-foreground-color: #d5d9e0;
        --tp-input-background-color: #23272e;
        --tp-input-background-color-active: #2e343d;
        --tp-input-background-color-focus: #2a3038;
        --tp-input-background-color-hover: #292f37;
        --tp-input-foreground-color: #e6eaf0;
        --tp-label-foreground-color: #8b929d;
        --tp-button-background-color: #333a44;
        --tp-button-background-color-active: #4a8cf7;
        --tp-button-background-color-focus: #3d4550;
        --tp-button-background-color-hover: #3a424d;
        --tp-button-foreground-color: #d5d9e0;
        --tp-monitor-background-color: #23272e;
        --tp-monitor-foreground-color: #8b929d;
        --tp-groove-foreground-color: #34383f;
      }

      /* ---- status bar + viewport hint ---- */
      #status {
        grid-area: stat;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 0 8px;
        background: var(--panel-head);
        border-top: 1px solid var(--line);
        color: var(--dim);
        font-size: 11px;
        white-space: nowrap;
        overflow: hidden;
      }
      #status b {
        color: var(--text);
        font-weight: 600;
      }
      #status .problem {
        color: #ff6b6b;
      }
      #hint {
        position: absolute;
        left: 10px;
        bottom: 8px;
        font-size: 11px;
        color: var(--dim);
        pointer-events: none;
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.8);
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="toolbar"></div>

      <div id="left" class="panel">
        <h2>Hierarchy</h2>
        <div id="hierarchy" class="panel-body"></div>
      </div>
      <div id="split-left" class="splitter"></div>

      <div id="centre">
        <canvas id="view"></canvas>
        <div id="hint">
          Orbit: drag · Select: click · T/R/S transform · Ctrl+D duplicate · Del delete · Esc deselect
        </div>
      </div>

      <div id="split-right" class="splitter"></div>
      <div id="right" class="panel">
        <h2>Inspector</h2>
        <div class="panel-body">
          <div id="insp-head"></div>
          <div id="inspector"></div>
          <div id="asset-inspector"></div>
        </div>
      </div>

      <div id="split-bottom" class="splitter"></div>
      <div id="bottom" class="panel">
        <div class="tabs" role="tablist">
          <button class="tab" data-tab="palette">Project</button>
          <span class="tab-note"></span>
        </div>
        <div id="palette" class="panel-body"></div>
      </div>

      <div id="status"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
