<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- `viewport-fit=cover` so the page reaches under a notch; the controls inset themselves from the
         safe area instead (ADR 0022). `maximum-scale`/`user-scalable` are ignored by iOS since iOS 10,
         so what actually suppresses pinch-zoom and double-tap-zoom of the *page* is `touch-action: none`
         on the canvas below plus `preventDefault` in the pointer handlers. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <title>TPS character controller — M10</title>
    <style>
      /* Exposed as custom properties so JS can read them: the controls inset themselves from the notch
         and the home indicator, which in landscape are the left/right insets. */
      :root {
        --safe-left: env(safe-area-inset-left, 0px);
        --safe-right: env(safe-area-inset-right, 0px);
        --safe-bottom: env(safe-area-inset-bottom, 0px);
      }
      html,
      body {
        margin: 0;
        /* `100%` first as the fallback, then `dvh`: on mobile the layout viewport is taller than what you
           can see, because the URL bar overlays it. Sizing to `100%` there puts the jump button and the
           stick *under browser chrome*. `dvh` tracks the visible height as the bar collapses. */
        height: 100%;
        height: 100dvh;
        overflow: hidden;
        background: #0b1020;
        color: #e2e8f0;
        font-family: system-ui, sans-serif;
      }
      /* The game fills the viewport; the renderer tracks this size (DPR-aware). */
      #view {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        height: 100dvh;
        display: block;
        /* The game owns every gesture on the canvas: no page scroll, no pinch-zoom, no double-tap zoom,
           and no 300 ms tap delay. Without this the browser eats the look drag (ADR 0022). */
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
      }
      .overlay {
        position: fixed;
        pointer-events: none;
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.7);
      }
      #status {
        top: 12px;
        left: 14px;
        font-size: 13px;
        opacity: 0.9;
      }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <div id="status" class="overlay">connecting…</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
